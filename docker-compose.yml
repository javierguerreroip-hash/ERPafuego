services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afuego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afuego_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-afuego_erp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - afuego_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-afuego}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afuego_pgdata:
